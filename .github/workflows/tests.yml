name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  phpunit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
        propel: ['2.0.0-beta1', '2.0.0-beta4', '2.0.1']
    name: PHP ${{ matrix.php }}, Propel ${{ matrix.propel }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: composer require --no-update --no-interaction propel/propel:${{ matrix.propel }}
      - run: composer update --no-interaction --no-progress
      - run: vendor/bin/phpunit
